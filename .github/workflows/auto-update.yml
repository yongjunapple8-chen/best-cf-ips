name: Auto Update Best Cloudflare IPs

on:
  schedule:
    # 每 6 小时自动运行一次
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动点击触发

jobs:
  update-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交和 Release 发布权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Cloudflare Speed Test
        run: |
          # 动态获取最新 Release 下载链接
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest \
            | grep "browser_download_url.*linux_amd64.tar.gz" \
            | cut -d : -f 2,3 \
            | tr -d '\" ')

          echo "Downloading from: $DOWNLOAD_URL"
          wget -q -O CloudflareSpeedTest_linux_amd64.tar.gz "$DOWNLOAD_URL"
          
          # 解压文件并递归赋予执行权限
          tar -zxf CloudflareSpeedTest_linux_amd64.tar.gz
          find . -type f \( -name "CloudflareST" -o -name "cfst" \) -exec chmod +x {} +

      - name: Run Speed Test
        run: |
          # 定位程序路径与所在目录
          EXEC_PATH=$(find . -type f \( -name "CloudflareST" -o -name "cfst" \) | head -n 1)
          EXEC_DIR=$(dirname "$EXEC_PATH")

          echo "Running in directory: $EXEC_DIR"

          # 切换进程序目录运行，确保能正常读取同目录下的 ip.txt
          cd "$EXEC_DIR"
          ./$(basename "$EXEC_PATH") -o result.csv -p 20 -tl 250 -dn 5

          # 提取最优 IP 并导出至仓库根目录
          awk -F',' 'NR>1 {print $1}' result.csv > "$GITHUB_WORKSPACE/best-cf-ipv4.txt"

      - name: Commit and Push Updated File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add best-cf-ipv4.txt
          if git diff --staged --quiet; then
            echo "No changes in IP list."
          else
            git commit -m "auto: update best-cf-ipv4.txt [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Auto Updated IPs (${{ format('{0}', github.event.head_commit.timestamp || 'Latest') }})"
          body: "Automatically generated list of best Cloudflare IPv4 addresses."
          files: |
            best-cf-ipv4.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
