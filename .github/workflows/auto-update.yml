name: Auto Update Best Cloudflare IPs

on:
  schedule:
    # 每 6 小时自动运行一次 (可根据需要修改 Cron 表达式)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击运行

jobs:
  update-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交代码和发布 Release 的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Cloudflare Speed Test
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest \
            | grep "browser_download_url.*linux_amd64.tar.gz" \
            | cut -d : -f 2,3 \
            | tr -d '\" ')

          echo "Downloading from: $DOWNLOAD_URL"
          wget -q -O CloudflareSpeedTest_linux_amd64.tar.gz "$DOWNLOAD_URL"
          
          # 解压并查看解压出的文件名
          tar -zxf CloudflareSpeedTest_linux_amd64.tar.gz
          ls -la

          # 赋予所有可执行权限
          chmod +x CloudflareST* 2>/dev/null || chmod +x cfst* 2>/dev/null || chmod +x *

      - name: Run Speed Test
        run: |
          # 自动寻找解压出的测速可执行程序运行
          EXEC_FILE=$(ls | grep -E '^(CloudflareST|cfst)' | head -n 1)
          if [ -z "$EXEC_FILE" ]; then
            # 如果没匹配到，退而求其次寻找除了压缩包外的可执行文件
            EXEC_FILE=$(find . -maxdepth 1 -type f -executable ! -name "*.tar.gz" ! -name "*.sh" | head -n 1)
          fi

          echo "Executing: $EXEC_FILE"
          ./"$EXEC_FILE" -o result.csv -p 20 -tl 250 -dn 5
          awk -F',' 'NR>1 {print $1}' result.csv > best-cf-ipv4.txt
      - name: Commit and Push Updated File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add best-cf-ipv4.txt
          if git diff --staged --quiet; then
            echo "No changes in IP list."
          else
            git commit -m "auto: update best-cf-ipv4.txt [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Auto Updated IPs (${{ format('{0}', github.event.head_commit.timestamp || 'Latest') }})"
          body: "Automatically generated list of best Cloudflare IPv4 addresses."
          files: |
            best-cf-ipv4.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
