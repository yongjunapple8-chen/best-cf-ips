name: Auto Update Best Cloudflare IPs

on:
  schedule:
    # 每 6 小时自动运行一次 (可根据需要修改 Cron 表达式)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击运行

jobs:
  update-ips:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予提交代码和发布 Release 的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Cloudflare Speed Test
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest \
            | grep "browser_download_url.*linux_amd64.tar.gz" \
            | cut -d : -f 2,3 \
            | tr -d '\" ')

          echo "Downloading from: $DOWNLOAD_URL"
          wget -q -O CloudflareSpeedTest_linux_amd64.tar.gz "$DOWNLOAD_URL"
          
          # 解压文件
          tar -zxf CloudflareSpeedTest_linux_amd64.tar.gz

          # 递归查找二进制可执行文件并赋予权限
          find . -type f \( -name "CloudflareST" -o -name "cfst" -o -name "*speedtest*" \) -exec chmod +x {} +

      - name: Run Speed Test
        run: |
          # 递归寻找真正的二进制文件（排除文件夹和压缩包）
          EXEC_PATH=$(find . -type f \( -name "CloudflareST" -o -name "cfst" \) | head -n 1)

          if [ -z "$EXEC_PATH" ]; then
            # 备用方案：寻找任何不在 .git 目录下的可执行文件
            EXEC_PATH=$(find . -maxdepth 2 -type f -executable ! -path "*/.git/*" ! -name "*.tar.gz" ! -name "*.sh" | head -n 1)
          fi

          echo "Executing binary at: $EXEC_PATH"
          "$EXEC_PATH" -o result.csv -p 20 -tl 250 -dn 5
          awk -F',' 'NR>1 {print $1}' result.csv > best-cf-ipv4.txt
          
      - name: Commit and Push Updated File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add best-cf-ipv4.txt
          if git diff --staged --quiet; then
            echo "No changes in IP list."
          else
            git commit -m "auto: update best-cf-ipv4.txt [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Auto Updated IPs (${{ format('{0}', github.event.head_commit.timestamp || 'Latest') }})"
          body: "Automatically generated list of best Cloudflare IPv4 addresses."
          files: |
            best-cf-ipv4.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
